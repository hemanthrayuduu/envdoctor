name: "EnvFixer"
description: "Diagnose environment drift ('passes locally, fails in CI') and gate the build."
branding:
  icon: "activity"
  color: "purple"

inputs:
  command:
    description: "Which command to run: 'diff' or 'check'."
    required: false
    default: "diff"
  working:
    description: "Path to the WORKING fingerprint JSON (for 'diff')."
    required: false
    default: "local.json"
  failing:
    description: "Path to the FAILING fingerprint JSON (for 'diff'). If it does not exist it is captured from the current environment."
    required: false
    default: "ci.json"
  traceback:
    description: "Optional path to the failing run's traceback/log to correlate."
    required: false
    default: ""
  format:
    description: "Output format: human, json, markdown, or sarif."
    required: false
    default: "markdown"
  fail-on:
    description: "Exit non-zero when a cause of at least this confidence is found (none|low|medium|high)."
    required: false
    default: "high"

runs:
  using: "composite"
  steps:
    - name: Install EnvFixer
      shell: bash
      run: python -m pip install --quiet envfixer

    - name: Run EnvFixer
      shell: bash
      run: |
        set -euo pipefail
        args=(--format "${{ inputs.format }}" --fail-on "${{ inputs.fail-on }}")
        if [ "${{ inputs.command }}" = "check" ]; then
          python -m envfixer check "${args[@]}"
        else
          if [ ! -f "${{ inputs.failing }}" ]; then
            python -m envfixer capture -o "${{ inputs.failing }}"
          fi
          if [ -n "${{ inputs.traceback }}" ]; then
            args+=(--traceback "${{ inputs.traceback }}")
          fi
          python -m envfixer diff "${{ inputs.working }}" "${{ inputs.failing }}" "${args[@]}"
        fi
