name: Publish to PyPI

# Publishes when you cut a GitHub Release (recommended), or manually via the
# Actions tab. Uses PyPI Trusted Publishing (OIDC) — no API token or secret is
# stored anywhere.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Must match the environment configured in the PyPI Trusted Publisher.
    environment:
      name: pypi
      url: https://pypi.org/p/envfixer
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Don't fail if this version is already on PyPI (e.g. re-running a
          # release, or a GitHub Release re-triggering the workflow). PyPI
          # versions are immutable, so an existing file is simply skipped.
          skip-existing: true
