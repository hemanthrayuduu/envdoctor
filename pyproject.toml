[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "envfixer"
version = "0.1.0"
description = "Root-cause diagnosis for 'passes locally, fails in CI' — ranks the likely cause of environment drift and prints a plain-English fix."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["ci", "environment", "diagnostics", "dependencies", "debugging", "reproducibility"]
authors = [{ name = "EnvFixer contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Systems Administration",
]
# Zero runtime dependencies — the core (capture/diff/check) is pure stdlib so
# it runs cleanly inside minimal CI containers.
dependencies = []

[project.urls]
Homepage = "https://github.com/hemanthrayuduu/envdoctor"
Repository = "https://github.com/hemanthrayuduu/envdoctor"
Issues = "https://github.com/hemanthrayuduu/envdoctor/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
envfixer = "envfixer.cli:main"

[tool.setuptools]
packages = ["envfixer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
